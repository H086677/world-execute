<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 · world.execute(me);</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: #05070d;
    color: #cfe3f5;
    font: 400 14px/1.7 "JetBrains Mono", ui-monospace, Consolas, monospace;
    text-align: center;
    padding: 24px;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 30%, rgba(111, 211, 255, .09), transparent 70%),
      radial-gradient(ellipse 40% 40% at 75% 70%, rgba(139, 156, 255, .07), transparent 70%);
    pointer-events: none;
  }
  .box { position: relative; max-width: 560px; }
  .code {
    font-size: clamp(52px, 12vw, 96px);
    font-weight: 700;
    letter-spacing: -.02em;
    line-height: 1;
    background: linear-gradient(180deg, #eaf6ff 0%, #6fd3ff 60%, #8b9cff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 26px rgba(111, 211, 255, .28));
  }
  h1 { margin: 18px 0 8px; font-size: 15px; font-weight: 600; letter-spacing: .16em; color: #9fb8d0; }
  p { margin: 0 0 26px; color: #6b8299; font-size: 13px; }
  code { color: #6fd3ff; }
  a {
    display: inline-block;
    padding: 11px 26px;
    border: 1px solid rgba(111, 211, 255, .38);
    border-radius: 999px;
    color: #bfe9ff;
    text-decoration: none;
    font-size: 12.5px;
    letter-spacing: .08em;
    transition: background .2s, border-color .2s, transform .2s;
  }
  a:hover { background: rgba(111, 211, 255, .1); border-color: rgba(111, 211, 255, .7); transform: translateY(-1px); }
  .glitch { position: relative; }
  .glitch::before, .glitch::after {
    content: attr(data-t);
    position: absolute; inset: 0;
    background: #05070d;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .glitch::before { background: linear-gradient(180deg, #ff4d6d, #ff4d6d); left: 1.5px; opacity: .5; }
  .glitch::after  { background: linear-gradient(180deg, #4dffd2, #4dffd2); left: -1.5px; opacity: .45; }
</style>
</head>
<body>
  <div class="box">
    <div class="code glitch" data-t="404">404</div>
    <h1>PAGE NOT FOUND</h1>
    <p>这个地址没有对应的指令。<br>Try <code>index.html</code> instead.</p>
    <a href="./">← 回到首页</a>
  </div>
</body>
</html>
